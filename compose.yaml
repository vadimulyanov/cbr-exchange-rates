name: cbr-rates

x-app: &app
    image: cbr-rates-app
    build:
        context: .
        target: app
    init: true
    environment:
        APP_ENV: prod
        APP_DEBUG: '0'
        DATABASE_URL: postgresql://cbr:cbr@database:5432/cbr?serverVersion=18&charset=utf8
        MESSENGER_TRANSPORT_DSN: amqp://cbr:cbr@rabbitmq:5672/%2f
    restart: unless-stopped
    stop_grace_period: 45s

services:
    database:
        image: postgres:18-bookworm
        environment:
            POSTGRES_DB: cbr
            POSTGRES_USER: cbr
            POSTGRES_PASSWORD: cbr
        volumes:
            - database-data:/var/lib/postgresql
        ports:
            - '127.0.0.1:${DATABASE_PORT:-15432}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U cbr -d cbr']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:4.2-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER: cbr
            RABBITMQ_DEFAULT_PASS: cbr
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        ports:
            - '127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672'
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    migrate:
        <<: *app
        restart: 'no'
        command: ['php', 'bin/console', 'doctrine:migrations:migrate', '--no-interaction']
        depends_on:
            database: { condition: service_healthy }

    app:
        <<: *app
        healthcheck:
            test: ['CMD', 'php', '-r', "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
            interval: 5s
            timeout: 3s
            retries: 20
        depends_on:
            migrate: { condition: service_completed_successfully }

    nginx:
        image: cbr-rates-web
        build:
            context: .
            target: web
        ports:
            - '127.0.0.1:${HTTP_PORT:-8088}:8080'
        depends_on:
            app: { condition: service_healthy }
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/api/doc.json']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    worker-planning:
        <<: *app
        command: ['php', 'bin/console', 'messenger:consume', 'planning', '--time-limit=3600', '--memory-limit=128M', '--no-interaction', '-vv']
        scale: ${PLANNING_WORKERS:-1}
        depends_on:
            migrate: { condition: service_completed_successfully }
            rabbitmq: { condition: service_healthy }

    worker-import:
        <<: *app
        command: ['php', 'bin/console', 'messenger:consume', 'imports', '--time-limit=3600', '--memory-limit=128M', '--no-interaction', '-vv']
        scale: ${IMPORT_WORKERS:-2}
        depends_on:
            migrate: { condition: service_completed_successfully }
            rabbitmq: { condition: service_healthy }

volumes:
    database-data:
    rabbitmq-data:
