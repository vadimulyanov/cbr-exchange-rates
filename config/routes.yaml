api_v1:
    resource: ../src/Controller/Api/V1/
    type: attribute
    prefix: /api/v1
    name_prefix: api_v1_

api_doc:
    path: /api/doc.json
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }

api_doc_ui:
    path: /api/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }
