doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            Cbr:
                type: attribute
                dir: '%kernel.project_dir%/src/Cbr/Entity'
                prefix: App\Cbr\Entity
                is_bundle: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test'
