name: Checks

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Build and start
              run: docker compose up -d --build --wait --wait-timeout 180
            - name: Check configuration and tests
              run: docker compose exec -T app composer check
            - name: Check import through RabbitMQ
              run: docker compose exec -T -e RABBITMQ_TEST_DSN=amqp://cbr:cbr@rabbitmq:5672/%2f app composer test:broker
            - name: Check HTTP and OpenAPI
              run: |
                  curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8088/api/doc.json -o /tmp/openapi.json
                  curl --fail http://127.0.0.1:8088/api/doc -o /dev/null
            - name: Logs
              if: failure()
              run: docker compose logs --no-color --tail=100
            - name: Collect test reports
              if: always()
              run: |
                  if docker compose exec -T app test -d /app/var/reports; then
                      docker compose cp app:/app/var/reports ./test-reports
                  fi
            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: test-reports
                  path: test-reports/*.xml
                  retention-days: 7
                  if-no-files-found: warn
            - name: Stop
              if: always()
              run: docker compose down --volumes
